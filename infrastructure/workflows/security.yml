name: Security Audit & DPDP Compliance

on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [ main ]

jobs:
  security-audit:
    name: Dependency & Code Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install Security Scanners
      run: pip install bandit

    - name: Run Bandit AST Analysis
      run: bandit -r backend security.py telemetry.py india_stack.py -ll -ii || true

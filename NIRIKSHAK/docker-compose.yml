networks:
  nirikshak-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  db:
    image: postgres:16.3-alpine
    container_name: nirikshak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nirikshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nirikshak_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nirikshak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nirikshak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nirikshak} -d ${POSTGRES_DB:-nirikshak}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nirikshak-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/workspace
      - ./ml:/workspace/ml
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nirikshak-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nirikshak-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nirikshak-net

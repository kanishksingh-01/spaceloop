name: SpaceLoop CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit, Security & Functional Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask Flask-SQLAlchemy requests groq google-genai pytest

    - name: Run India Stack & Telemetry Tests
      run: python -m unittest test_india_stack.py

    - name: Run Core Marketplace Tests
      run: python -m unittest verify_spaceloop.py

    - name: Run Security & Hardening Tests
      run: python -m unittest test_security.py

    - name: Run 14-Point End-to-End Functional Audit
      run: python -m unittest test_all_features_functional.py

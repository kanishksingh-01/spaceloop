openapi: 3.0.3
info:
  title: SpaceLoop REST API Specification
  description: Zero-Hardware India Stack, Dual-Sided Document Verification, AI Micro-Leasing Platform.
  version: 2.4.0
paths:
  /api/spaces:
    get:
      summary: List all active micro-spaces
      responses:
        '200':
          description: Array of micro-spaces
  /api/spaces/ai-scan:
    post:
      summary: Multimodal AI Space Inspector
      responses:
        '200':
          description: Spatial diagnostics and recommended price
  /api/spaces/ai-match:
    post:
      summary: Natural Language Semantic Matchmaker
      responses:
        '200':
          description: Compatibility scores and ranked spaces
  /api/bookings:
    post:
      summary: Create booking with AI micro-lease and ₹100 escrow
      responses:
        '201':
          description: Booking created
  /api/booking/{id}/check-in:
    post:
      summary: GPS Radar (<50m) and Door QR check-in handshake
      responses:
        '200':
          description: Check-in verified
  /api/booking/{id}/check-out:
    post:
      summary: Exit visual delta inspection and instant ₹100 UPI refund
      responses:
        '200':
          description: Check-out verified
